[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-guided-compiler-auto-tuner"
version = "0.1.0"
description = "A bounded, correctness-checked LLVM pass tuning experiment"
requires-python = ">=3.11"
dependencies = ["openai>=2.0,<3", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn>=0.30"]
graph = ["langgraph>=0.2"]
test = ["pytest>=8", "httpx>=0.27", "coverage>=7"]

[project.scripts]
autotuner = "autotuner.cli:main"

[tool.setuptools]
packages = ["autotuner"]
include-package-data = true

[tool.coverage.run]
source = ["autotuner"]
branch = true

[tool.coverage.report]
show_missing = true
precision = 1

